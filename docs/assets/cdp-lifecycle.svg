<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, Arial, sans-serif">
  <style>.t{font-size:13px;fill:#33536e}.b{font-size:15px;fill:#0b3d66;font-weight:bold}</style>
  <text x="380" y="26" text-anchor="middle" class="b" font-size="17">Continuous Data Protection (CDP)</text>

  <rect x="40" y="55" width="200" height="110" rx="8" fill="#c8f7d4" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="140" y="82" text-anchor="middle" class="b" font-size="14">Données actives</text>
  <text x="140" y="106" text-anchor="middle" class="t">Stockage courant</text>
  <text x="140" y="126" text-anchor="middle" class="t">Lecture/écriture</text>

  <rect x="280" y="55" width="200" height="110" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="380" y="82" text-anchor="middle" class="b" font-size="14">Time Travel</text>
  <text x="380" y="106" text-anchor="middle" class="t">0–90 j (selon édition)</text>
  <text x="380" y="126" text-anchor="middle" class="t">AT | BEFORE | UNDROP</text>
  <text x="380" y="146" text-anchor="middle" class="t" font-style="italic">Accessible par l'utilisateur</text>

  <rect x="520" y="55" width="200" height="110" rx="8" fill="#ffe0e0" stroke="#c62828" stroke-width="1.5"/>
  <text x="620" y="82" text-anchor="middle" class="b" font-size="14">Fail-safe</text>
  <text x="620" y="106" text-anchor="middle" class="t">7 jours (fixe)</text>
  <text x="620" y="126" text-anchor="middle" class="t">Tables permanentes</text>
  <text x="620" y="146" text-anchor="middle" class="t" font-style="italic">Support Snowflake only</text>

  <line x1="240" y1="110" x2="278" y2="110" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="110" x2="518" y2="110" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker></defs>

  <rect x="40" y="195" width="680" height="78" rx="8" fill="#fff7d6" stroke="#e0a800"/>
  <text x="55" y="218" class="t" font-weight="bold">Pièges examen</text>
  <text x="55" y="238" class="t">• Time Travel = configurable (DATA_RETENTION_TIME_IN_DAYS), accessible par SQL.  • Fail-safe = 7 j non configurable, Snowflake support only.</text>
  <text x="55" y="258" class="t">• Tables TEMPORARY et TRANSIENT → AUCUN Fail-safe.  Coût stockage = actif + Time Travel + Fail-safe.</text>
</svg>
