<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Arial, sans-serif">
  <style>.t{font-size:13px;fill:#33536e}.b{font-size:15px;fill:#0b3d66;font-weight:bold}.mp{stroke:#1565c0;stroke-width:1.5}</style>
  <text x="380" y="26" text-anchor="middle" class="b" font-size="17">Micro-partitions &amp; Pruning</text>
  <text x="40" y="58" class="t">Table triée naturellement sur <tspan font-weight="bold">date_vente</tspan>. Chaque micro-partition (50–500 Mo) stocke min/max par colonne.</text>

  <!-- partitions -->
  <g>
  <rect x="40" y="80" width="130" height="90" rx="6" class="mp" fill="#e3f2fd"/>
  <text x="105" y="104" text-anchor="middle" class="t" font-weight="bold">MP1</text>
  <text x="105" y="126" text-anchor="middle" class="t">min 01-01</text>
  <text x="105" y="146" text-anchor="middle" class="t">max 01-10</text>

  <rect x="190" y="80" width="130" height="90" rx="6" class="mp" fill="#c8f7d4" stroke="#2e7d32"/>
  <text x="255" y="104" text-anchor="middle" class="t" font-weight="bold">MP2 ✓ lue</text>
  <text x="255" y="126" text-anchor="middle" class="t">min 01-11</text>
  <text x="255" y="146" text-anchor="middle" class="t">max 01-20</text>

  <rect x="340" y="80" width="130" height="90" rx="6" class="mp" fill="#f0f0f0" stroke="#9e9e9e"/>
  <text x="405" y="104" text-anchor="middle" class="t" font-weight="bold">MP3 ✗ skip</text>
  <text x="405" y="126" text-anchor="middle" class="t">min 01-21</text>
  <text x="405" y="146" text-anchor="middle" class="t">max 01-31</text>

  <rect x="490" y="80" width="130" height="90" rx="6" class="mp" fill="#f0f0f0" stroke="#9e9e9e"/>
  <text x="555" y="104" text-anchor="middle" class="t" font-weight="bold">MP4 ✗ skip</text>
  <text x="555" y="126" text-anchor="middle" class="t">min 02-01</text>
  <text x="555" y="146" text-anchor="middle" class="t">max 02-10</text>
  </g>

  <rect x="40" y="200" width="680" height="50" rx="6" fill="#fff7d6" stroke="#e0a800"/>
  <text x="55" y="222" class="t" font-weight="bold">Requête : WHERE date_vente = '2024-01-15'</text>
  <text x="55" y="240" class="t">Snowflake compare la valeur aux min/max → ne scanne que MP2. MP1/3/4 éliminées (pruning).</text>

  <text x="40" y="282" class="b" font-size="14">Clustering depth</text>
  <text x="40" y="304" class="t">≈ 1 → micro-partitions peu chevauchantes = excellent pruning.</text>
  <text x="40" y="324" class="t">Valeur élevée → fort chevauchement → CLUSTER BY / Automatic Clustering recommandé sur grandes tables (TB+).</text>
</svg>
