<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .lbl{font-size:15px;fill:#0b3d66;font-weight:bold}
    .sub{font-size:12px;fill:#33536e}
    .layer{stroke:#1565c0;stroke-width:1.5}
    .wh{fill:#e3f2fd;stroke:#1565c0;stroke-width:1.5}
  </style>
  <text x="380" y="26" text-anchor="middle" class="lbl" font-size="17">Architecture Snowflake — 3 couches découplées</text>

  <!-- Cloud services -->
  <rect x="40" y="50" width="680" height="80" rx="8" fill="#d7ecff" class="layer"/>
  <text x="60" y="78" class="lbl">☁ Couche Services Cloud (Cloud Services)</text>
  <text x="60" y="100" class="sub">Optimiseur · Métadonnées · Sécurité &amp; Authentification · Gestion transactions · Result Cache · Infrastructure manager</text>
  <text x="60" y="119" class="sub">Toujours active — facturée seulement au-delà de 10% des crédits de calcul du jour.</text>

  <!-- Compute -->
  <rect x="40" y="150" width="680" height="120" rx="8" fill="#eef6ff" class="layer"/>
  <text x="60" y="176" class="lbl">⚙ Couche Calcul (Compute) — Virtual Warehouses (MPP)</text>
  <rect x="70" y="190" width="150" height="64" rx="6" class="wh"/><text x="145" y="226" text-anchor="middle" class="sub">Warehouse 1 (ETL)</text>
  <rect x="245" y="190" width="150" height="64" rx="6" class="wh"/><text x="320" y="226" text-anchor="middle" class="sub">Warehouse 2 (BI)</text>
  <rect x="420" y="190" width="150" height="64" rx="6" class="wh"/><text x="495" y="226" text-anchor="middle" class="sub">Warehouse 3 (DS)</text>
  <rect x="595" y="190" width="100" height="64" rx="6" class="wh" stroke-dasharray="5 4"/><text x="645" y="226" text-anchor="middle" class="sub">… N</text>
  <text x="60" y="266" class="sub" font-style="italic">Indépendants : aucune contention entre warehouses. Local (SSD) cache par warehouse.</text>

  <!-- Storage -->
  <rect x="40" y="290" width="680" height="100" rx="8" fill="#d7ecff" class="layer"/>
  <text x="60" y="316" class="lbl">🗄 Couche Stockage (Database Storage)</text>
  <text x="60" y="338" class="sub">Micro-partitions · format colonnaire compressé · centralisé sur le cloud object store (S3 / Blob / GCS)</text>
  <text x="60" y="357" class="sub">Géré 100% par Snowflake · métadonnées min/max par colonne → pruning automatique</text>
  <text x="60" y="378" class="sub" font-style="italic">SaaS uniquement — aucune installation on-premise possible.</text>
</svg>
