          - "4.3 Caching (3 niveaux)": core/d4-performance/4-3-cache.md
          - "4.4 Transformation des données": core/d4-performance/4-4-transformation.md
      - "Domain 5.0 — Data Collaboration (10%)":
          - "5.1 Collaboration & protection": core/d5-collaboration/5-1-collab-protection.md
          - "5.2 Data Sharing": core/d5-collaboration/5-2-sharing.md
          - "5.3 Marketplace & listings": core/d5-collaboration/5-3-marketplace.md

