site_name: SnowPro Certifications — Documentation Officielle
site_description: COF-C03 · DEA-C02 · SPS-C01 (Snowpark)
site_author: Said-ABOULOUAFA
site_url: https://Said-ABOULOUAFA.github.io/Snowflake/

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

repo_name: Said-ABOULOUAFA/Snowflake
repo_url: https://github.com/Said-ABOULOUAFA/Snowflake

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true

nav:
  - Accueil: index.md

  - "🎯 COF-C03 — SnowPro Core":
      - Vue d'ensemble & Prérequis: core/index.md
      - "D1 — Architecture (31%)":
