site_name: SnowPro Certification — Doc Personnelle
site_description: Préparation SnowPro Core COF-C03 & Data Engineer DEA-C02
site_author: Said-ABOULOUAFA
site_url: https://Said-ABOULOUAFA.github.io/Snowflake/

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

repo_name: Said-ABOULOUAFA/Snowflake
repo_url: https://github.com/Said-ABOULOUAFA/Snowflake

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Accueil: index.md

  - "🎯 SnowPro Core COF-C03":
      - Vue d'ensemble: core/index.md
      - "1 · Architecture":
          - Concepts clés & couches: core/architecture/concepts-cles.md
          - Types de tables: core/architecture/types-tables.md
          - Types de vues: core/architecture/vues.md
          - Entrepôts virtuels: core/architecture/entrepots-virtuels.md
          - Éditions Snowflake: core/architecture/editions.md
          - Cortex AI, Notebooks & Streamlit: core/architecture/cortex-ai.md
      - "2 · Account Management & Gouvernance":
          - Rôles & privilèges (RBAC): core/securite/roles-privileges.md
          - Authentification & réseau: core/securite/authentification.md
          - Chiffrement & masquage: core/securite/chiffrement-masquage.md
          - Resource Monitors & Trust Center: core/securite/account-management.md
      - "3 · Performance":
          - Micro-partitions & clustering: core/performance/micro-partitions.md
          - Cache (3 niveaux) & QAS: core/performance/cache-avance.md
          - Query Profile & optimisation: core/performance/cache-optimisation.md
      - "4 · Chargement & Export":
          - Stages & file formats: core/chargement/stages-formats.md
          - COPY INTO & Snowpipe: core/chargement/copy-snowpipe.md
          - Export & unload: core/chargement/export.md
      - "5 · Transformation":
          - Streams & Tasks: core/transformation/streams-tasks.md
          - Tables dynamiques & dbt: core/transformation/dynamic-tables-dbt.md
          - Snowpark: core/transformation/snowpark.md
      - "6 · Data Collaboration":
          - Time Travel & Fail-safe: core/protection/time-travel-failsafe.md
          - Clonage (Zero-Copy): core/protection/clonage.md
          - Data Sharing & Marketplace: core/protection/sharing-marketplace.md
          - Reader Accounts & Native Apps: core/protection/reader-accounts-native-apps.md

  - "⚙️ SnowPro Data Engineer DEA-C02":
      - Vue d'ensemble: engineer/index.md
      - "1 · Data Movement (28%)":
          - Ingestion batch & streaming: engineer/data-movement/ingestion.md
          - INFER_SCHEMA, Tables externes & Openflow: engineer/data-movement/infer-schema-external.md
          - Connecteurs & intégrations: engineer/data-movement/connecteurs.md
          - Troubleshooting ingestion: engineer/data-movement/troubleshooting.md
      - "2 · Data Transformation (30%)":
          - Pipelines, MERGE & fonctions fenêtre: engineer/data-transformation/pipelines.md
          - Snowpark Python avancé & UDFs/UDAFs: engineer/data-transformation/snowpark-avance.md
          - Cortex LLM, dbt & Git integration: engineer/data-transformation/cortex-dbt-git.md
          - Procédures stockées & transactions: engineer/data-transformation/procedures-udfs.md
      - "3 · Performance Optimization (22%)":
          - Clustering & pruning avancé: engineer/performance/clustering-avance.md
          - Query Profile & diagnostics: engineer/performance/query-profile.md
          - Monitoring pipelines & alertes: engineer/performance/monitoring-avance.md
      - "4 · Storage & Protection (10%)":
          - CDP, Time Travel, Fail-safe: engineer/storage/cdp.md
          - Réplication inter-régions: engineer/storage/replication.md
      - "5 · Data Governance (10%)":
          - Tagging, classification, lineage: engineer/data-governance/gouvernance.md
      - "6 · Security":
          - Dynamic Data Masking: engineer/security/masking.md
          - Row Access & Projection Policies: engineer/security/row-access.md
          - Network policies & OAuth: engineer/security/network-oauth.md

  - "📝 Fiches révision":
      - Cheat sheet Core COF-C03: revision/cheatsheet-core.md
      - Cheat sheet Data Engineer DEA-C02: revision/cheatsheet-engineer.md
      - Questions fréquentes (FAQ): revision/faq.md
