site_name: SnowPro Certifications — Documentation
site_description: Préparation officielle COF-C03 · DEA-C02 · SPS-C01
site_author: Said-ABOULOUAFA
site_url: https://Said-ABOULOUAFA.github.io/Snowflake/

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

repo_name: Said-ABOULOUAFA/Snowflake
repo_url: https://github.com/Said-ABOULOUAFA/Snowflake

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Accueil: index.md

  - "🎯 COF-C03 · Core":
      - Vue d'ensemble & prérequis: core/index.md
      - "Domain 1.0 — AI Data Cloud & Architecture (31%)":
          - "1.1 Architecture Snowflake": core/d1-architecture/1-1-architecture.md
          - "1.2 Interfaces & outils": core/d1-architecture/1-2-interfaces.md
          - "1.3 Hiérarchie & types d'objets": core/d1-architecture/1-3-objets.md
          - "1.4 Entrepôts virtuels": core/d1-architecture/1-4-warehouses.md
          - "1.5 Concepts de stockage": core/d1-architecture/1-5-stockage.md
          - "1.6 AI/ML & développement applicatif": core/d1-architecture/1-6-ai-ml.md
      - "Domain 2.0 — Account Management & Governance (20%)":
          - "2.1 Modèle de sécurité (RBAC)": core/d2-governance/2-1-securite.md
          - "2.2 Data Governance": core/d2-governance/2-2-gouvernance.md
          - "2.3 Monitoring & gestion des coûts": core/d2-governance/2-3-monitoring-couts.md
      - "Domain 3.0 — Data Loading, Unloading & Connectivity (18%)":
          - "3.1 Chargement & déchargement": core/d3-loading/3-1-load-unload.md
          - "3.2 Ingestion automatisée": core/d3-loading/3-2-ingestion-auto.md
